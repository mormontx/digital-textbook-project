<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="system-ui, sans-serif">
  <rect width="700" height="240" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Distance vs. Displacement</text>

  <!-- Number line -->
  <line x1="50" y1="120" x2="650" y2="120" stroke="#aaa" stroke-width="1.5"/>

  <!-- Ticks: 0 to 10, spacing = 55px -->
  <g font-size="10" fill="#777" text-anchor="middle">
    <line x1="50"  y1="116" x2="50"  y2="126" stroke="#aaa" stroke-width="1"/><text x="50"  y="140">0</text>
    <line x1="105" y1="116" x2="105" y2="126" stroke="#aaa" stroke-width="1"/><text x="105" y="140">1</text>
    <line x1="160" y1="116" x2="160" y2="126" stroke="#aaa" stroke-width="1"/><text x="160" y="140">2</text>
    <line x1="215" y1="116" x2="215" y2="126" stroke="#aaa" stroke-width="1"/><text x="215" y="140">3</text>
    <line x1="270" y1="116" x2="270" y2="126" stroke="#aaa" stroke-width="1"/><text x="270" y="140">4</text>
    <line x1="325" y1="116" x2="325" y2="126" stroke="#aaa" stroke-width="1"/><text x="325" y="140">5</text>
    <line x1="380" y1="116" x2="380" y2="126" stroke="#aaa" stroke-width="1"/><text x="380" y="140">6</text>
    <line x1="435" y1="116" x2="435" y2="126" stroke="#aaa" stroke-width="1"/><text x="435" y="140">7</text>
    <line x1="490" y1="116" x2="490" y2="126" stroke="#aaa" stroke-width="1"/><text x="490" y="140">8</text>
    <line x1="545" y1="116" x2="545" y2="126" stroke="#aaa" stroke-width="1"/><text x="545" y="140">9</text>
    <line x1="600" y1="116" x2="600" y2="126" stroke="#aaa" stroke-width="1"/><text x="600" y="140">10 m</text>
  </g>

  <!-- Forward arrow: 0 to 10m (green-grey) -->
  <line x1="54" y1="88" x2="592" y2="88" stroke="#5a7a5a" stroke-width="2"/>
  <polygon points="592,83 604,88 592,93" fill="#5a7a5a"/>
  <text x="320" y="82" text-anchor="middle" font-size="11" fill="#5a7a5a" font-weight="600">+10 m forward</text>

  <!-- Return arrow: 10m back to 6m (muted red) -->
  <line x1="596" y1="102" x2="388" y2="102" stroke="#a04040" stroke-width="2"/>
  <polygon points="388,97 376,102 388,107" fill="#a04040"/>
  <text x="495" y="98" text-anchor="middle" font-size="11" fill="#a04040" font-weight="600">-4 m back</text>

  <!-- Start dot -->
  <circle cx="50" cy="120" r="5" fill="#5a7a5a"/>
  <text x="50" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#5a7a5a">Start</text>

  <!-- End dot -->
  <circle cx="380" cy="120" r="5" fill="#3a6a9a"/>
  <text x="380" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#3a6a9a">Finish</text>

  <!-- Turn dot -->
  <circle cx="600" cy="120" r="4" fill="#a04040" opacity="0.6"/>
  <text x="600" y="158" text-anchor="middle" font-size="9" fill="#a04040">Turn</text>

  <!-- Displacement arrow below number line -->
  <line x1="50" y1="185" x2="372" y2="185" stroke="#3a6a9a" stroke-width="2.5"/>
  <polygon points="372,180 384,185 372,190" fill="#3a6a9a"/>
  <text x="215" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#3a6a9a">Displacement = +6 m</text>

  <!-- Summary -->
  <rect x="440" y="168" width="230" height="52" rx="6" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="555" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#333">Summary</text>
  <text x="555" y="202" text-anchor="middle" font-size="10" fill="#5a7a5a">Distance = 14 m (scalar)</text>
  <text x="555" y="216" text-anchor="middle" font-size="10" fill="#3a6a9a">Displacement = +6 m (vector)</text>
</svg>
