<svg viewBox="0 0 200 300" width="150" height="225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="charcoal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#charcoal)" stroke="#2c2c2c" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="100" cy="60" r="25" stroke-width="4" opacity="0.8"/>
    <circle cx="100" cy="60" r="24" stroke-width="2.4" transform="translate(1, 0)" opacity="0.6"/>
    <circle cx="100" cy="60" r="26" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 85 Q 110 120 105 170" stroke-width="5" opacity="0.8"/>
    <path d="M 100 85 Q 110 120 105 170" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 85 Q 110 120 105 170" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 105 170 Q 130 210 160 260" stroke-width="5" opacity="0.8"/>
    <path d="M 105 170 Q 130 210 160 260" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 105 170 Q 130 210 160 260" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 105 170 Q 90 220 60 260" stroke-width="5" opacity="0.8"/>
    <path d="M 105 170 Q 90 220 60 260" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 105 170 Q 90 220 60 260" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 100 Q 140 110 170 130" stroke-width="4" opacity="0.8"/>
    <path d="M 100 100 Q 140 110 170 130" stroke-width="2.4" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 100 Q 140 110 170 130" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 100 Q 60 100 40 140" stroke-width="4" opacity="0.8"/>
    <path d="M 100 100 Q 60 100 40 140" stroke-width="2.4" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 100 Q 60 100 40 140" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <!-- Motion lines -->
    <path d="M 30 100 L 10 95" stroke-width="2" opacity="0.5"/>
    <path d="M 40 180 L 20 175" stroke-width="2" opacity="0.5"/>
    <!-- Funny facial expression looking right -->
    <path d="M 95 55 Q 100 50 105 55" stroke-width="2"/>
    <path d="M 115 55 Q 120 50 125 55" stroke-width="2"/>
    <circle cx="100" cy="65" r="2" fill="#2c2c2c"/>
    <circle cx="120" cy="65" r="2" fill="#2c2c2c"/>
    <path d="M 105 75 Q 110 80 115 75" stroke-width="2"/>
  </g>
</svg>
