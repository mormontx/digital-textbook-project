<svg viewBox="0 0 200 300" width="150" height="225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="charcoal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fbfbfb" />
  <g filter="url(#charcoal)" stroke="#2c2c2c" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="100" cy="60" r="25" stroke-width="4" opacity="0.8"/>
    <circle cx="100" cy="60" r="24" stroke-width="2.4" transform="translate(1, 0)" opacity="0.6"/>
    <circle cx="100" cy="60" r="26" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 85 Q 95 130 100 180" stroke-width="5" opacity="0.8"/>
    <path d="M 100 85 Q 95 130 100 180" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 85 Q 95 130 100 180" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 180 Q 90 230 80 280" stroke-width="5" opacity="0.8"/>
    <path d="M 100 180 Q 90 230 80 280" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 180 Q 90 230 80 280" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 180 Q 110 230 120 280" stroke-width="5" opacity="0.8"/>
    <path d="M 100 180 Q 110 230 120 280" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 180 Q 110 230 120 280" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 100 Q 70 120 50 150" stroke-width="4" opacity="0.8"/>
    <path d="M 100 100 Q 70 120 50 150" stroke-width="2.4" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 100 Q 70 120 50 150" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 100 Q 130 120 150 150" stroke-width="4" opacity="0.8"/>
    <path d="M 100 100 Q 130 120 150 150" stroke-width="2.4" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 100 Q 130 120 150 150" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <!-- Funny facial expression -->
    <path d="M 85 55 Q 90 50 95 55" stroke-width="2"/>
    <path d="M 105 55 Q 110 50 115 55" stroke-width="2"/>
    <circle cx="90" cy="65" r="2" fill="#2c2c2c"/>
    <circle cx="110" cy="65" r="2" fill="#2c2c2c"/>
    <path d="M 95 75 Q 100 80 105 75" stroke-width="2"/>
  </g>
</svg>
