<svg viewBox="0 0 200 300" width="150" height="225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="charcoal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#charcoal)" stroke="#2c2c2c" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <circle cx="100" cy="60" r="25" stroke-width="4" opacity="0.8"/>
    <circle cx="100" cy="60" r="24" stroke-width="2.4" transform="translate(1, 0)" opacity="0.6"/>
    <circle cx="100" cy="60" r="26" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 85 Q 90 120 95 170" stroke-width="5" opacity="0.8"/>
    <path d="M 100 85 Q 90 120 95 170" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 85 Q 90 120 95 170" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 95 170 Q 70 210 40 260" stroke-width="5" opacity="0.8"/>
    <path d="M 95 170 Q 70 210 40 260" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 95 170 Q 70 210 40 260" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 95 170 Q 110 220 140 260" stroke-width="5" opacity="0.8"/>
    <path d="M 95 170 Q 110 220 140 260" stroke-width="3.0" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 95 170 Q 110 220 140 260" stroke-width="2.0" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 100 Q 60 110 30 130" stroke-width="4" opacity="0.8"/>
    <path d="M 100 100 Q 60 110 30 130" stroke-width="2.4" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 100 Q 60 110 30 130" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <path d="M 100 100 Q 140 100 160 140" stroke-width="4" opacity="0.8"/>
    <path d="M 100 100 Q 140 100 160 140" stroke-width="2.4" transform="translate(1, -1)" opacity="0.6"/>
    <path d="M 100 100 Q 140 100 160 140" stroke-width="1.6" transform="translate(-1, 1)" opacity="0.7"/>
    
    <!-- Motion lines -->
    <path d="M 170 100 L 190 95" stroke-width="2" opacity="0.5"/>
    <path d="M 160 180 L 180 175" stroke-width="2" opacity="0.5"/>
    <!-- Funny facial expression looking left -->
    <path d="M 75 55 Q 80 50 85 55" stroke-width="2"/>
    <path d="M 95 55 Q 100 50 105 55" stroke-width="2"/>
    <circle cx="80" cy="65" r="2" fill="#2c2c2c"/>
    <circle cx="100" cy="65" r="2" fill="#2c2c2c"/>
    <path d="M 85 75 Q 90 80 95 75" stroke-width="2"/>
  </g>
</svg>
