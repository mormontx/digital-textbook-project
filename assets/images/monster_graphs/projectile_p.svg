<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg" style="background-color: transparent; font-family: sans-serif;">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#39ff14" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8b4fe" />
    </marker>
</defs>

            <!-- Ground -->
            <line x1="20" y1="160" x2="380" y2="160" stroke="#a78bfa" stroke-width="2"/>
            <path d="M 20 160 L 10 170 M 30 160 L 20 170 M 40 160 L 30 170 M 50 160 L 40 170 M 60 160 L 50 170 M 70 160 L 60 170 M 80 160 L 70 170 M 90 160 L 80 170 M 100 160 L 90 170 M 110 160 L 100 170 M 120 160 L 110 170 M 130 160 L 120 170 M 140 160 L 130 170 M 150 160 L 140 170 M 160 160 L 150 170 M 170 160 L 160 170 M 180 160 L 170 170 M 190 160 L 180 170 M 200 160 L 190 170 M 210 160 L 200 170 M 220 160 L 210 170 M 230 160 L 220 170 M 240 160 L 230 170 M 250 160 L 240 170 M 260 160 L 250 170 M 270 160 L 260 170 M 280 160 L 270 170 M 290 160 L 280 170 M 300 160 L 290 170 M 310 160 L 300 170 M 320 160 L 310 170 M 330 160 L 320 170 M 340 160 L 330 170 M 350 160 L 340 170 M 360 160 L 350 170 M 370 160 L 360 170 M 380 160 L 370 170" stroke="#a78bfa" stroke-width="1"/>
            
            <!-- Trajectory (Parabola) -->
            <path d="M 50 160 Q 200 10 350 160" fill="none" stroke="#4c1d95" stroke-width="2" stroke-dasharray="6,4"/>
            
            <!-- Launch point -->
            <circle cx="50" cy="160" r="4" fill="#39ff14"/>
            
            <!-- Vector arrow -->
            <line x1="50" y1="160" x2="110" y2="110" stroke="#39ff14" stroke-width="2" marker-end="url(#arrow)"/>
            <text x="50" y="100" fill="#0f172a" font-size="14">28.5 ms<tspan dy="-5" font-size="10">-1</tspan></text>
            
            <!-- Angle -->
            <path d="M 80 160 A 30 30 0 0 0 75 139" fill="none" stroke="#0f172a" stroke-width="1"/>
            <text x="85" y="153" fill="#0f172a" font-size="14">40°</text>
            
            <!-- Point P -->
            <circle cx="180" cy="56" r="4" fill="#8b5cf6"/>
            <text x="175" y="45" fill="#0f172a" font-size="16">P</text>
            
            <!-- Vertical line to P -->
            <line x1="180" y1="160" x2="180" y2="56" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="4,2"/>
            
            <!-- Horizontal distance -->
            <line x1="50" y1="175" x2="180" y2="175" stroke="#d8b4fe" stroke-width="1" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
            <text x="115" y="195" fill="#0f172a" font-size="14" text-anchor="middle">20.0 m</text>
        </svg>