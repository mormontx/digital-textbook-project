<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Vector Components</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: #ffffff;
            --panel-border: #c8c8c4;
            --header-gradient: linear-gradient(135deg, #e8e6e2 0%, #f2f2f0 100%);
            --neon-green: #4a7c59;
            --neon-cyan: #2a6db5;
            --neon-pink: #b0392b;
            --text-primary: #1e1e1e;
            --text-secondary: #555555;
            --font-main: "Sora", sans-serif;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-primary);
            background-color: #f0f0f0;
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
        }

        .header {
            background: var(--header-gradient);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-cyan);
            margin: 0;
        }

        .main-content {
            display: flex;
            flex-direction: row;
            height: 400px;
        }

        .canvas-area {
            flex: 2;
            background: #fcfcfc;
            position: relative;
            border-right: 1px solid var(--panel-border);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            flex: 1;
            padding: 1.5rem;
            background: #ebebea;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .slider-input {
            width: 100%;
        }

        .readout {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-top: auto;
        }

        .readout p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            font-family: monospace;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .color-x { color: var(--neon-pink); }
        .color-y { color: var(--neon-green); }
        .color-v { color: var(--neon-cyan); }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Vector Components Simulation</h2>
        </div>
        <div class="main-content">
            <div class="canvas-area">
                <canvas id="vectorCanvas"></canvas>
            </div>
            <div class="controls">
                <div class="slider-group">
                    <div class="slider-header">
                        <span>Magnitude (v)</span>
                        <span id="magVal" class="color-v">50.0</span>
                    </div>
                    <input type="range" id="magSlider" class="slider-input" min="10" max="100" value="50">
                </div>
                
                <div class="slider-group">
                    <div class="slider-header">
                        <span>Angle (&theta;)</span>
                        <span id="angleVal" class="color-v">45&deg;</span>
                    </div>
                    <input type="range" id="angleSlider" class="slider-input" min="0" max="90" value="45">
                </div>

                <div class="readout">
                    <p class="color-x"><span>v<sub>x</sub> = v &times; cos(&theta;)</span> <span id="vxOut">0.0</span></p>
                    <p class="color-y"><span>v<sub>y</sub> = v &times; sin(&theta;)</span> <span id="vyOut">0.0</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("vectorCanvas");
        const ctx = canvas.getContext("2d");
        const magSlider = document.getElementById("magSlider");
        const angleSlider = document.getElementById("angleSlider");
        const magVal = document.getElementById("magVal");
        const angleVal = document.getElementById("angleVal");
        const vxOut = document.getElementById("vxOut");
        const vyOut = document.getElementById("vyOut");

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }

        window.addEventListener("resize", resizeCanvas);

        function drawArrow(fromX, fromY, toX, toY, color) {
            const headlen = 10;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background Grid
            ctx.strokeStyle = "#e0e0e0";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=20) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            const v = parseFloat(magSlider.value);
            const thetaDeg = parseFloat(angleSlider.value);
            const thetaRad = thetaDeg * Math.PI / 180;

            const vx = v * Math.cos(thetaRad);
            const vy = v * Math.sin(thetaRad);

            magVal.innerText = v.toFixed(1);
            angleVal.innerHTML = thetaDeg + "&deg;";
            vxOut.innerText = vx.toFixed(1);
            vyOut.innerText = vy.toFixed(1);

            // Scale for drawing (max v is 100, so scale accordingly)
            const scale = Math.min(canvas.width, canvas.height) / 120;
            const originX = 40;
            const originY = canvas.height - 40;

            const endX = originX + vx * scale;
            const endY = originY - vy * scale;

            // Draw axes
            ctx.strokeStyle = "#888";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, canvas.height);
            ctx.moveTo(0, originY);
            ctx.lineTo(canvas.width, originY);
            ctx.stroke();

            // Draw vx
            drawArrow(originX, originY, endX, originY, "#b0392b"); // pink/red
            
            // Draw vy
            drawArrow(endX, originY, endX, endY, "#4a7c59"); // green
            
            // Draw v resultant
            drawArrow(originX, originY, endX, endY, "#2a6db5"); // cyan

            // Labels
            ctx.font = "600 14px Sora, sans-serif";
            ctx.fillStyle = "#b0392b";
            ctx.fillText("v_x = " + vx.toFixed(1), originX + (endX-originX)/2 - 20, originY + 20);
            
            ctx.fillStyle = "#4a7c59";
            ctx.fillText("v_y = " + vy.toFixed(1), endX + 10, originY - (originY-endY)/2);
            
            ctx.fillStyle = "#2a6db5";
            ctx.fillText("v = " + v.toFixed(1), originX + (endX-originX)/2 - 30, originY - (originY-endY)/2 - 10);
            
            // Arc for angle
            ctx.beginPath();
            ctx.arc(originX, originY, 30, -thetaRad, 0);
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = "#555";
            ctx.fillText(thetaDeg + "°", originX + 35, originY - 10);
        }

        magSlider.addEventListener("input", draw);
        angleSlider.addEventListener("input", draw);
        
        // Initial draw
        setTimeout(() => {
            resizeCanvas();
        }, 100);
    </script>
</body>
</html>
