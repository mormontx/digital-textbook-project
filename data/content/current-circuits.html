<h1>Current and Circuits</h1>

<h2>Current and Voltage</h2>
<div class="equation-block">
$$I = \frac{\Delta q}{\Delta t}$$
$$V = \frac{W}{q}$$
</div>

<h2>Resistance</h2>
<div class="equation-block">
$$R = \frac{V}{I}$$
$$\rho = \frac{RA}{L}$$
</div>

<h2>Power</h2>
<div class="equation-block">
$$P = IV = I^2R = \frac{V^2}{R}$$
</div>

<h2>EMF and Internal Resistance</h2>
<div class="equation-block">
$$\varepsilon = I(R + r)$$
</div>
