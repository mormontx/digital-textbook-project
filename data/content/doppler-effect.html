<h1>Doppler Effect</h1>

<h2>For Light</h2>
<div class="equation-block">
$$\frac{\Delta f}{f} = \frac{\Delta\lambda}{\lambda} \approx \frac{v}{c}$$
</div>

<h2>For Sound (HL)</h2>
<p class="hl-note">This is Higher Level content.</p>
<div class="equation-block">
$$f' = f\frac{v}{v \pm u_s}$$
$$f' = f\frac{v \pm u_o}{v}$$
</div>
