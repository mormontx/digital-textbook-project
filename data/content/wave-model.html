<h1>Wave Model</h1>

<h2>Wave Types</h2>
<ul>
<li><strong>Transverse</strong>: Oscillation ⟂ propagation (light, string waves)</li>
<li><strong>Longitudinal</strong>: Oscillation ∥ propagation (sound)</li>
</ul>

<h2>Wave Equation</h2>
<div class="equation-block">
$$v = f\lambda = \frac{\lambda}{T}$$
</div>

<h2>EM Waves</h2>
<p>Travel through vacuum at c = 3×10⁸ ms<sup>-1</sup></p>
