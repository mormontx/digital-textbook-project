<h1>Gravitational Fields</h1>

<h2>Newton's Law</h2>
<div class="equation-block">
$$F = \frac{Gm_1m_2}{r^2}$$
$$g = \frac{F}{m} = \frac{GM}{r^2}$$
</div>

<h2>Gravitational Potential (HL)</h2>
<div class="equation-block">
$$V_g = -\frac{GM}{r}$$
$$E_p = -\frac{GMm}{r}$$
$$v_{orbital} = \sqrt{\frac{GM}{r}}$$
$$v_{escape} = \sqrt{\frac{2GM}{r}}$$
</div>
